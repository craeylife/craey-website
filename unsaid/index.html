   Black #0D0709, bone #F1DCC6, ink #1A0B0E, crimson #C8102E, a brighter red #FF4B5C for small type on black, yellow #FFD60A only for what you can act on.

:root {
  --black: #0D0709; --night: #0D0709; --paper: #F1DCC6; --ink: #1A0B0E; --crimson: #C8102E; --hot: #FF4B5C; --power: #FFD60A;

  --display: "Anek Latin", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;

  --gut: clamp(16px, 5vw, 64px);
  --swh: 52px;
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--night); color: var(--paper); font: 400 18px/1.6 var(--display); overflow-x: clip; }
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
h1, h2, h3, p, ol { margin: 0; }
:focus-visible { outline: 2px solid var(--power); outline-offset: 3px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
/* the slim black bar (class navtop: "top" is the most-marked line) on the live page and the Write desk (the board has its own switcher) */
.navtop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: var(--swh); padding: 0 var(--gut); background: var(--black); border-bottom: 1px solid rgba(241, 220, 198, .16); color: var(--paper); }
.navtop a, .navtop b { color: var(--paper); font: 700 17px/1 var(--display); font-stretch: 75%; letter-spacing: .22em; text-transform: uppercase; text-decoration: none; }
.navtop span { font: 500 11px/1.2 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
/* ===== READ: the live page and the Write desk preview =====
   A thread of time runs down the page, a huge ghost numeral marks each year, every letter hangs off the thread. Marking a line is the one gesture:
   your marks are red text, the crowd's marks are an underline that grows with the number. Older years fold up behind their numerals. */
.sn-page { color-scheme: dark; position: relative; max-width: 1120px; margin: 0 auto; padding: 0 var(--gut) 160px; }

.sn-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.sn-chips a { padding: 8px 10px; border-bottom: 1px solid transparent; color: var(--dim); font: 500 14px/1 var(--display); letter-spacing: .12em; font-variant-numeric: tabular-nums; text-decoration: none; }
.sn-chips a[aria-current] { color: var(--paper); border-color: var(--hot); }
@media (hover: hover) { .sn-chips a:hover { color: var(--paper); } }
.wb { appearance: none; cursor: pointer; margin-left: auto; white-space: nowrap; padding: 11px 18px; border: 1px solid rgba(241, 220, 198, .45); border-radius: 999px; background: transparent; color: var(--paper); font: 600 12px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; }
@media (hover: hover) { .wb:hover { background: var(--paper); color: var(--ink); } }

/* the thread, the years, the letters */
.sn { --P: clamp(30px, 6vw, 96px); --L: clamp(8px, 2vw, 28px); position: relative; padding-left: var(--P); }
.sn::before { content: ""; position: absolute; left: var(--L); top: 0; bottom: 0; width: 1px; background: linear-gradient(var(--hot), rgba(255, 75, 92, .12)); }

.sn-gy { position: absolute; top: 0; left: -.03em; font: 800 clamp(130px, 26vw, 330px)/.8 var(--display); font-stretch: 75%; color: transparent; -webkit-text-stroke: 1px rgba(241, 220, 198, .16); font-variant-numeric: tabular-nums; pointer-events: none; user-select: none; }

.sn-to { margin: 14px 0 0; font: 700 clamp(30px, 4.4vw, 52px)/1 var(--display); font-stretch: 80%; color: #FFF4EA; overflow-wrap: anywhere; }

.sn-item.clamp:not(.open) .sn-body { max-height: 7em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 38%, transparent); mask-image: linear-gradient(#000 38%, transparent); }

.sn-foot { margin-top: 56px; font: 500 14px/1.4 var(--display); color: var(--dim); }

/* a line of a letter: the thing you tap */
.ln { display: block; width: 100%; margin: 0; padding: .14em 0; border: 0; background: none; text-align: left; color: inherit; font: inherit; cursor: pointer; position: relative; appearance: none; }
.ln-t { background: linear-gradient(var(--mk, var(--hot)), var(--mk, var(--hot))) no-repeat 0 100% / 0% 2px; transition: background-size .45s; }

.ln.on .ln-t { color: var(--hot); background-position: 0 96%; background-size: 100% .1em; }
.ln.top .ln-t { color: var(--power); }
.ln-c { margin-left: .6em; font: 700 .56em/1 var(--display); font-variant-numeric: tabular-nums; opacity: 0; vertical-align: .35em; transition: opacity .4s calc(var(--i, 0) * 50ms); }
.seen .ln-c { opacity: .85; }
.ln.loud { font-weight: 700; font-size: 1.12em; }

.db-gap { height: 1.1em; }
.db-x { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--hot); text-decoration-thickness: .09em; }
.m-most { margin-top: 26px; font: 500 14px/1.5 var(--display); color: var(--dim); } .m-most b { color: var(--power); font-weight: 700; }

/* the tray (your marks, copy them) and the copy box */
.m-tray { position: fixed; z-index: 40; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 20px; white-space: nowrap; background: var(--night); border: 1px solid rgba(241, 220, 198, .4); border-radius: 999px; box-shadow: 0 12px 40px rgba(0, 0, 0, .55); color: var(--paper); }
.m-tcount { font: 700 13px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; }
.m-tray button { appearance: none; cursor: pointer; padding: 12px 18px; border: 0; border-radius: 999px; background: var(--power); color: var(--night); font: 800 12px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; }
.m-tray button.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 1px rgba(241, 220, 198, .5); }

.m-copybox p { margin: 0 0 8px; font: 700 12px/1.3 var(--display); letter-spacing: .1em; text-transform: uppercase; }
.m-copybox textarea { width: 100%; height: 110px; padding: 8px; border: 1px solid var(--ink); background: #fff7ee; font: 500 15px/1.4 var(--display); }

/* the sheet where a visitor writes */
.spf { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: rgba(5, 3, 4, .88); overflow-y: auto; }
.spf-p { width: min(560px, 100%); margin: auto; padding: 24px; background: #150B0E; color: var(--paper); border: 1px solid rgba(241, 220, 198, .25); }
.spf-body { display: grid; gap: 14px; }
.spf label { display: grid; gap: 8px; font: 700 12px/1 var(--display); letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }
.spf input, .spf textarea { width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid rgba(241, 220, 198, .45); border-radius: 0; background: none; color: var(--paper); font: 400 20px/1.5 var(--display); }
.spf textarea { min-height: 200px; resize: vertical; }
.spf input:focus-visible, .spf textarea:focus-visible { outline: none; border-color: var(--power); }
.spf-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.spf-mail, .spf-copy, .spf-close { appearance: none; cursor: pointer; padding: 13px 22px; border: 0; border-radius: 999px; font: 800 12px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; text-decoration: none; }
.spf-mail { background: var(--power); color: var(--ink); }
.spf-addr { margin-top: 2px; font: 500 15px/1.3 var(--display); letter-spacing: .02em; color: var(--dim); user-select: all; overflow-wrap: anywhere; }
.spf-copy, .spf-close { background: transparent; box-shadow: inset 0 0 0 1px rgba(241, 220, 198, .5); color: var(--paper); }

@media (max-width: 700px) {
  .sn-bar { gap: 6px; } .sn-chips a { padding: 8px 6px; letter-spacing: .04em; } .wb { padding: 10px 14px; letter-spacing: .14em; }
}
@media (prefers-reduced-motion: reduce) { .ln-t, .ln-c { transition: none; } }

tyle="--i:0"><span class="ln-t">AAWAAZ</span><b class="ln-c" data-cnt></b></button></div><p class="m-most sn-most" hidden></p><div class="sn-act"><button class="db-share" type="button" data-share="001">Copy link</button></div></article></section></div><div class="m-tray" hidden><span class="m-tcount"></span><button class="m-clear ghost" type="button">Clear</button><button class="m-copy" type="button">Copy bars</button></div></main><div class="spf" id="spf" data-mail="craeysam@gmail.com" hidden><div class="spf-p" role="dialog" aria-label="Write a letter"><div class="spf-body"><label>To<input maxlength="40" autocomplete="off"></label><textarea maxlength="600" aria-label="Your letter"></textarea><div class="spf-row"><a class="spf-mail" href="#">Send by email</a><button class="spf-copy" type="button">Copy letter</button><button class="spf-close" type="button">Cancel</button></div><p class="spf-addr">craeysam@gmail.com</p></div></div></div><script>(() => {
  'use strict';
  /* ============ core: helpers, how a letter is read, and a letter's markup for the Write desk preview ============
     Letter syntax: one line = one line on the page (and one thing a visitor can mark). ~~crossed out~~ inside a line. **a whole line** is loud.
     [page: file.jpg] or [page: file.jpg | what the page says] on its own line is a photo of a handwritten page. A blank line starts a new part.
     The live page is rendered by build_unsaid.py (same markup as itemHTML below); this file renders the board and the Write desk preview. */
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const el = (t, c, txt) => { const x = document.createElement(t); if (c) x.className = c; if (txt) x.textContent = txt; return x; };
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const pad = n => String(n).padStart(2, '0');
  const prettyDate = d => `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
  const prettyTime = d => `${d.getHours() % 12 || 12}:${pad(d.getMinutes())} ${d.getHours() < 12 ? 'AM' : 'PM'}`;

  const parseLine = raw => {
    let t = raw.trim(), loud = false;
    const m = t.match(/^\*\*(.+)\*\*$/); if (m) { loud = true; t = m[1]; }
    return { html: esc(t).replace(/~~(.+?)~~/g, '<s class="db-x">$1</s>'), plain: t.replace(/~~(.+?)~~/g, '').replace(/\s{2,}/g, ' ').trim(), loud };
  };
  const items = text => text.split('\n').map(r => r.trim()).map(r => {
    if (!r) return { k: 'gap' };
    const p = r.match(/^\[page:\s*(.*?)\]$/i); if (p) { const [name, ...c] = p[1].split('|'); return { k: 'page', name: name.trim(), cap: c.join('|').trim() }; }
    return Object.assign({ k: 'bar' }, parseLine(r));
  });
  const bars = l => items(l.text).filter(x => x.k === 'bar').map(x => x.plain);
  const render = (text, mk) => {
    let bi = 0, out = '', prev = 'gap';
    items(text).forEach(it => {
      if (it.k === 'gap') { if (prev !== 'gap') out += '<div class="db-gap"></div>'; prev = 'gap'; return; }
      out += it.k === 'page' ? mk.page(it.name, it.cap) : mk.bar(it, bi++); prev = it.k;

    return out;
  };
  // sample crowd numbers for the board and the sample build (the real numbers come from the counter service)
  const demoBase = (n, k) => {

  /* ============ read: marking, crowd heat, the tray ============
     Tap a line to mark it. Once you have marked one line in a letter, the crowd's marks show on every line of that letter,

       GET  {api}/marks?n=003                    -> {"n":"003","counts":[0,12,3,...]}   one number per line, in order

                                                    id is a random per-device string, so one device counts once per line) */
  function makeMarks(key) {
